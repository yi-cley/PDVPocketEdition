<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PDV de Bolso: vendas e estoque para pequenos comércios, operado pelo teclado.">
  <meta name="theme-color" content="#151a30">
  <title>PDV de Bolso</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>
    /* aplica o tema salvo antes de desenhar a tela (RF-38) */
    try {
      var t = localStorage.getItem('pdv-tema');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { /* sem localStorage: fica o tema claro */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
